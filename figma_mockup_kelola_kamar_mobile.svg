<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 1080" width="412" height="1080" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="phoneBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primaryGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="btnGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="imgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="imgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <filter id="phoneShadow2" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <filter id="cardElevated2" x="-5%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.02"/>
    </filter>
    <filter id="bottomBarShadow" x="0%" y="-20%" width="100%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <clipPath id="screenClip2">
      <rect x="18" y="18" width="376" height="1044" rx="44"/>
    </clipPath>
  </defs>

  <!-- Outer Phone Body (iPhone 15 Pro Style Frame) -->
  <g filter="url(#phoneShadow2)">
    <rect x="12" y="12" width="388" height="1056" rx="50" fill="url(#phoneBorder2)"/>
    <rect x="14" y="14" width="384" height="1052" rx="48" fill="#0F172A"/>
    <rect x="18" y="18" width="376" height="1044" rx="44" fill="#F8FAFC"/>
  </g>

  <!-- Content Clipped to Screen -->
  <g clip-path="url(#screenClip2)">
    <!-- Sticky Top App Bar & Header -->
    <rect x="18" y="18" width="376" height="108" fill="#FFFFFF"/>
    
    <!-- Dynamic Island -->
    <rect x="148" y="27" width="116" height="30" rx="15" fill="#000000"/>
    <circle cx="242" cy="42" r="5" fill="#1E293B"/>

    <!-- Status Bar Elements -->
    <text x="50" y="46" fill="#0F172A" font-size="13" font-weight="600" letter-spacing="-0.3">09:41</text>
    <g transform="translate(325, 36)" fill="#0F172A">
      <path d="M1 9 C2 4, 7 1, 12 1 C17 1, 22 4, 23 9" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="25" y="2" width="18" height="9" rx="3" fill="#0F172A"/>
    </g>

    <!-- Navigation Bar -->
    <g transform="translate(32, 68)">
      <circle cx="16" cy="16" r="16" fill="#F1F5F9"/>
      <path d="M19 10 L13 16 L19 22" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="44" y="22" fill="#0F172A" font-size="17" font-weight="800" letter-spacing="-0.4">Tambah Unit Kamar</text>
      
      <!-- Mitra Tag Badge -->
      <rect x="270" y="4" width="70" height="24" rx="12" fill="#EEF2FF"/>
      <text x="305" y="19" fill="#4F46E5" font-size="10" font-weight="700" text-anchor="middle">Ibu Yeni</text>
    </g>
    <line x1="18" y1="126" x2="394" y2="126" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- SCROLLABLE CONTENT BODY -->

    <!-- SECTION 1: FOTO & MEDIA KAMAR (Slide 8 Bab 5: Minimal 3 Foto) -->
    <g transform="translate(34, 138)">
      <text x="0" y="14" fill="#0F172A" font-size="14" font-weight="800">1. Galeri Foto Kamar</text>
      <text x="145" y="14" fill="#64748B" font-size="11">(Min. 3 Foto Terkompresi)</text>

      <!-- Foto 1 (Utama) -->
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="160" height="105" rx="14" fill="url(#imgGrad1)"/>
        <!-- Room illustration icon -->
        <rect x="20" y="60" width="120" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.25"/>
        <text x="80" y="55" fill="#FFFFFF" font-size="24" text-anchor="middle">🛏️</text>
        <rect x="8" y="8" width="76" height="20" rx="6" fill="#0F172A" fill-opacity="0.75"/>
        <text x="46" y="21" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">★ Foto Sampul</text>
      </g>

      <!-- Foto 2 (Kamar Mandi) -->
      <g transform="translate(170, 26)">
        <rect x="0" y="0" width="80" height="105" rx="14" fill="url(#imgGrad2)"/>
        <text x="40" y="55" fill="#FFFFFF" font-size="20" text-anchor="middle">🚿</text>
        <rect x="6" y="8" width="68" height="18" rx="5" fill="#0F172A" fill-opacity="0.65"/>
        <text x="40" y="20" fill="#FFFFFF" font-size="8" font-weight="600" text-anchor="middle">KM Dalam</text>
      </g>

      <!-- Foto 3 (Tambah Foto / Slot 3) -->
      <g transform="translate(260, 26)">
        <rect x="0" y="0" width="84" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="4 4"/>
        <circle cx="42" cy="45" r="14" fill="#EEF2FF"/>
        <text x="42" y="50" fill="#4F46E5" font-size="16" font-weight="700" text-anchor="middle">+</text>
        <text x="42" y="75" fill="#64748B" font-size="9" font-weight="600" text-anchor="middle">Tambah Foto</text>
        <text x="42" y="87" fill="#94A3B8" font-size="8" text-anchor="middle">&lt; 500 KB</text>
      </g>
    </g>

    <!-- SECTION 2: INFORMASI DASAR UNIT -->
    <g transform="translate(34, 290)" filter="url(#cardElevated2)">
      <rect x="0" y="0" width="344" height="180" rx="18" fill="#FFFFFF"/>
      <text x="18" y="24" fill="#0F172A" font-size="13" font-weight="800">2. Identitas Unit Kamar</text>

      <!-- Field Nomor Kamar -->
      <text x="18" y="50" fill="#64748B" font-size="11" font-weight="600">Nomor Kamar</text>
      <rect x="18" y="58" width="144" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="30" y="84" fill="#0F172A" font-size="13" font-weight="700">Kamar 04</text>

      <!-- Field Ukuran -->
      <text x="174" y="50" fill="#64748B" font-size="11" font-weight="600">Ukuran Ruangan</text>
      <rect x="174" y="58" width="152" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="186" y="84" fill="#0F172A" font-size="13" font-weight="600">3 x 4 Meter</text>

      <!-- Tipe Kamar (Segmented Control Pill Switch) -->
      <text x="18" y="122" fill="#64748B" font-size="11" font-weight="600">Tipe Fasilitas Kamar</text>
      <rect x="18" y="130" width="308" height="38" rx="10" fill="#F1F5F9"/>
      
      <!-- Active Pill -->
      <rect x="20" y="132" width="152" height="34" rx="8" fill="#4F46E5" filter="url(#cardElevated2)"/>
      <text x="96" y="153" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">✓ Berperabot</text>

      <!-- Inactive Option -->
      <text x="250" y="153" fill="#64748B" font-size="12" font-weight="500" text-anchor="middle">Kosongan</text>
    </g>

    <!-- SECTION 3: STATUS KETERSEDIAAN (Hasil Uji Pengguna #2: Segmented Pills Warna-Warni) -->
    <g transform="translate(34, 485)" filter="url(#cardElevated2)">
      <rect x="0" y="0" width="344" height="98" rx="18" fill="#FFFFFF"/>
      <text x="18" y="24" fill="#0F172A" font-size="13" font-weight="800">3. Status Ketersediaan (1-Click Sentuh)</text>

      <!-- Status 1: Kosong (Active Emerald) -->
      <rect x="16" y="38" width="98" height="44" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <circle cx="28" cy="60" r="4.5" fill="#10B981"/>
      <text x="38" y="64" fill="#065F46" font-size="11" font-weight="800">Kosong</text>
      <text x="38" y="74" fill="#047857" font-size="8">Siap Huni</text>

      <!-- Status 2: Dipesan (Amber) -->
      <rect x="122" y="38" width="98" height="44" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
      <circle cx="134" cy="60" r="4" fill="#F59E0B"/>
      <text x="144" y="64" fill="#92400E" font-size="11" font-weight="600">Dipesan</text>
      <text x="144" y="74" fill="#B45309" font-size="8">Booking</text>

      <!-- Status 3: Terisi (Slate) -->
      <rect x="228" y="38" width="98" height="44" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="240" cy="60" r="4" fill="#94A3B8"/>
      <text x="250" y="64" fill="#64748B" font-size="11" font-weight="600">Terisi</text>
      <text x="250" y="74" fill="#94A3B8" font-size="8">Penuh</text>
    </g>

    <!-- SECTION 4: FASILITAS TERPASANG (Interactive Chips) -->
    <g transform="translate(34, 598)" filter="url(#cardElevated2)">
      <rect x="0" y="0" width="344" height="116" rx="18" fill="#FFFFFF"/>
      <text x="18" y="24" fill="#0F172A" font-size="13" font-weight="800">4. Fasilitas Kamar (Pilih Sesuai Unit)</text>

      <!-- Row 1 -->
      <g transform="translate(18, 38)">
        <rect x="0" y="0" width="88" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="44" y="19" fill="#3730A3" font-size="11" font-weight="700" text-anchor="middle">❄️ AC</text>

        <rect x="96" y="0" width="102" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="147" y="19" fill="#3730A3" font-size="11" font-weight="700" text-anchor="middle">🛏️ Kasur Busa</text>

        <rect x="206" y="0" width="102" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="257" y="19" fill="#3730A3" font-size="11" font-weight="700" text-anchor="middle">🚪 Lemari 2 Pintu</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(18, 74)">
        <rect x="0" y="0" width="112" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="56" y="19" fill="#3730A3" font-size="11" font-weight="700" text-anchor="middle">🚿 KM Dalam</text>

        <rect x="120" y="0" width="94" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="167" y="19" fill="#3730A3" font-size="11" font-weight="700" text-anchor="middle">📶 WiFi Cepat</text>

        <rect x="222" y="0" width="86" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="265" y="19" fill="#64748B" font-size="11" font-weight="500" text-anchor="middle">+ Lainnya</text>
      </g>
    </g>

    <!-- SECTION 5: HARGA & DEPOSIT TRANSPARAN (Prinsip Slide 7) -->
    <g transform="translate(34, 728)" filter="url(#cardElevated2)">
      <rect x="0" y="0" width="344" height="152" rx="18" fill="#FFFFFF"/>
      <text x="18" y="24" fill="#0F172A" font-size="13" font-weight="800">5. Rincian Tarif Sewa &amp; Deposit Jaminan</text>

      <text x="18" y="48" fill="#64748B" font-size="11" font-weight="600">Tarif Sewa Bulanan (Rp)</text>
      <rect x="18" y="56" width="308" height="44" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="32" y="83" fill="#10B981" font-size="16" font-weight="800">Rp 850.000</text>
      <text x="240" y="83" fill="#64748B" font-size="11" font-weight="500">/ bulan</text>

      <!-- Deposit Card Pill (Hasil Uji Pengguna #3) -->
      <rect x="18" y="108" width="308" height="32" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="30" y="128" fill="#15803D" font-size="11" font-weight="700">Deposit Kunci: Rp 200.000</text>
      <text x="190" y="128" fill="#166534" font-size="10">(Dikembalikan 100%)</text>
    </g>

    <!-- FIXED FLOATING BOTTOM BAR WITH CTA -->
    <g transform="translate(18, 935)" filter="url(#bottomBarShadow)">
      <rect x="0" y="0" width="376" height="127" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="376" y2="0" stroke="#F1F5F9" stroke-width="1.5"/>

      <!-- CTA Button (Elevated) -->
      <g transform="translate(18, 14)">
        <rect x="0" y="0" width="340" height="52" rx="16" fill="url(#btnGrad2)"/>
        <text x="170" y="32" fill="#FFFFFF" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="-0.2">
          ✓ Simpan &amp; Terbitkan Kamar
        </text>
      </g>
      
      <!-- Real-time publish note -->
      <text x="188" y="82" fill="#64748B" font-size="10" text-anchor="middle">
        Sinkronisasi katalog publik &lt; 10 detik (Target NF-04)
      </text>

      <!-- Home Indicator -->
      <rect x="128" y="94" width="120" height="4.5" rx="2.5" fill="#0F172A"/>
    </g>
  </g>
</svg>

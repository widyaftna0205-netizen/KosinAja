<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 870" width="412" height="870" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="60%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <filter id="cardElevated" x="-5%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <filter id="btnShadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="18" y="18" width="376" height="834" rx="44"/>
    </clipPath>
  </defs>

  <!-- Outer Phone Body (iPhone 15 Pro Style Frame) -->
  <g filter="url(#phoneShadow)">
    <rect x="12" y="12" width="388" height="846" rx="50" fill="url(#phoneBorder)"/>
    <rect x="14" y="14" width="384" height="842" rx="48" fill="#0F172A"/>
    <rect x="18" y="18" width="376" height="834" rx="44" fill="#F8FAFC"/>
  </g>

  <!-- Content Clipped to Screen -->
  <g clip-path="url(#screenClip)">
    <!-- Top Hero Background with Wave/Glow -->
    <rect x="18" y="18" width="376" height="280" fill="url(#heroGrad)"/>
    <circle cx="340" cy="80" r="120" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="80" cy="220" r="90" fill="#818CF8" fill-opacity="0.15"/>

    <!-- Dynamic Island -->
    <rect x="148" y="27" width="116" height="30" rx="15" fill="#000000"/>
    <circle cx="242" cy="42" r="5" fill="#1E293B"/>

    <!-- Status Bar Elements -->
    <text x="50" y="46" fill="#FFFFFF" font-size="13" font-weight="600" letter-spacing="-0.3">09:41</text>
    <g transform="translate(325, 36)" fill="#FFFFFF">
      <path d="M1 9 C2 4, 7 1, 12 1 C17 1, 22 4, 23 9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="25" y="2" width="18" height="9" rx="3" fill="#FFFFFF"/>
    </g>

    <!-- Brand Header -->
    <g transform="translate(42, 90)">
      <!-- Logo Badge Icon -->
      <rect x="0" y="0" width="46" height="46" rx="14" fill="#FFFFFF" filter="url(#cardElevated)"/>
      <path d="M13 25 L23 15 L33 25 V33 H13 Z" fill="#4F46E5"/>
      <path d="M20 33 V26 H26 V33" fill="#818CF8"/>

      <text x="58" y="22" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="-0.5">KosinAja</text>
      <text x="58" y="38" fill="#C7D2FE" font-size="11" font-weight="500">Platform Kos Digital &amp; Mitra UMKM</text>
    </g>

    <text x="42" y="172" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="-0.5">Kos Putri Anak Lanang</text>
    <text x="42" y="194" fill="#E0E7FF" font-size="12" font-weight="400">Portal Pengelola Mitra • Ibu Yeni</text>

    <!-- Floating Auth Card -->
    <g transform="translate(34, 220)" filter="url(#cardElevated)">
      <rect x="0" y="0" width="344" height="480" rx="24" fill="#FFFFFF"/>
      
      <!-- Card Pill Badge -->
      <rect x="24" y="24" width="154" height="26" rx="13" fill="#EEF2FF"/>
      <circle cx="36" cy="37" r="4" fill="#4F46E5"/>
      <text x="46" y="41" fill="#4338CA" font-size="11" font-weight="700">MODUL UC-08 LOGIN</text>

      <text x="24" y="80" fill="#0F172A" font-size="18" font-weight="800" letter-spacing="-0.3">Masuk Panel Mitra</text>
      <text x="24" y="100" fill="#64748B" font-size="12">Kelola unit kamar, tarif sewa, &amp; pemesanan.</text>

      <!-- Account Info Pill (Auto-Fill Hint) -->
      <rect x="24" y="118" width="296" height="46" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="42" cy="141" r="10" fill="#4F46E5" fill-opacity="0.1"/>
      <text x="42" y="145" fill="#4F46E5" font-size="11" font-weight="800" text-anchor="middle">i</text>
      <text x="60" y="136" fill="#334155" font-size="11" font-weight="600">Akun Pengelola Resmi:</text>
      <text x="60" y="152" fill="#64748B" font-size="11">yeni@kosinaja.id (Ibu Yeni)</text>

      <!-- Form Input 1: Email -->
      <text x="24" y="192" fill="#1E293B" font-size="12" font-weight="700">Email Pengelola</text>
      <rect x="24" y="202" width="296" height="50" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.8"/>
      <!-- Mail Icon -->
      <g transform="translate(38, 218)" stroke="#4F46E5" stroke-width="1.6" fill="none">
        <rect x="0" y="0" width="18" height="14" rx="3"/>
        <path d="M0 2 L9 8 L18 2"/>
      </g>
      <text x="66" y="233" fill="#0F172A" font-size="13" font-weight="500">yeni@kosinaja.id</text>

      <!-- Form Input 2: Password -->
      <text x="24" y="278" fill="#1E293B" font-size="12" font-weight="700">Kata Sandi</text>
      <rect x="24" y="288" width="296" height="50" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <!-- Lock Icon -->
      <g transform="translate(38, 304)" stroke="#64748B" stroke-width="1.6" fill="none">
        <rect x="1" y="6" width="16" height="11" rx="2.5"/>
        <path d="M4 6 V4 A5 5 0 0 1 14 4 V6"/>
      </g>
      <text x="66" y="320" fill="#0F172A" font-size="15" font-weight="700" letter-spacing="2">••••••••••••</text>
      
      <!-- Eye Icon (Heuristik Nielsen #5) -->
      <g transform="translate(290, 305)" stroke="#64748B" stroke-width="1.5" fill="none">
        <path d="M1 7 C4 2, 12 2, 15 7 C12 12, 4 12, 1 7 Z"/>
        <circle cx="8" cy="7" r="2.5" fill="#64748B"/>
      </g>

      <!-- Microcopy Security Info -->
      <text x="24" y="356" fill="#16A34A" font-size="11" font-weight="600">✓ Enkripsi Hash Bcrypt (Aman &amp; Terproteksi)</text>

      <!-- CTA Button (Elevated) -->
      <g transform="translate(24, 380)" filter="url(#btnShadow)">
        <rect x="0" y="0" width="296" height="50" rx="14" fill="url(#btnGrad)"/>
        <text x="148" y="31" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="-0.2">Masuk ke Dasbor Admin →</text>
      </g>

      <!-- Footer Action -->
      <text x="172" y="456" fill="#4F46E5" font-size="12" font-weight="600" text-anchor="middle">← Kembali ke Katalog Publik Toko</text>
    </g>

    <!-- Bottom Legal / Compliance Pill -->
    <g transform="translate(56, 725)">
      <rect x="0" y="0" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="18" cy="17" r="6" fill="#10B981"/>
      <path d="M15 17 L17 19 L21 15" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <text x="32" y="21" fill="#475569" font-size="10" font-weight="600">Permendag 19/2026 • NIB OSS Terverifikasi</text>
    </g>

    <!-- Home Indicator -->
    <rect x="146" y="836" width="120" height="4.5" rx="2.5" fill="#0F172A"/>
  </g>
</svg>

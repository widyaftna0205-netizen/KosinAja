<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" style="background:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadowPC" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Sidebar Desktop -->
  <rect width="250" height="760" fill="#0F172A"/>
  
  <!-- Sidebar Brand -->
  <g transform="translate(24, 28)">
    <rect width="36" height="36" rx="10" fill="#4F46E5"/>
    <text x="18" y="24" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">K</text>
    <text x="48" y="24" fill="#FFFFFF" font-size="18" font-weight="800">KosinAja</text>
  </g>
  <text x="24" y="86" fill="#64748B" font-size="11" font-weight="600">PANEL MITRA KOS</text>
  <text x="24" y="104" fill="#94A3B8" font-size="12">Kos Putri Anak Lanang</text>
  <text x="24" y="120" fill="#64748B" font-size="10">Mitra: Ibu Yeni (Pasir Pengaraian)</text>

  <!-- Sidebar Nav Menu Items -->
  <g transform="translate(16, 150)">
    <!-- Active Item: Kelola Kamar (UC-09) -->
    <rect width="218" height="42" rx="10" fill="#4F46E5"/>
    <text x="20" y="26" fill="#FFFFFF" font-size="13" font-weight="700">🛏️ Kelola Unit Kamar</text>

    <!-- Inactive Items -->
    <text x="20" y="76" fill="#94A3B8" font-size="13" font-weight="500">🏢 Profil Kos &amp; Legalitas</text>
    <text x="20" y="122" fill="#94A3B8" font-size="13" font-weight="500">🌐 Buka Katalog Toko</text>
    <text x="20" y="168" fill="#94A3B8" font-size="13" font-weight="500">📊 Laporan Ketersediaan</text>
  </g>

  <!-- Sidebar Bottom Logout (UC-08) -->
  <g transform="translate(24, 700)">
    <text x="0" y="0" fill="#EF4444" font-size="12" font-weight="600">🚪 Keluar Sesi (Logout)</text>
    <text x="0" y="18" fill="#64748B" font-size="10">yeni@kosinaja.id</text>
  </g>

  <!-- Top Header Desktop -->
  <rect x="250" width="950" height="70" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="280" y="42" fill="#0F172A" font-size="18" font-weight="800">Dasbor Manajemen Unit Kamar (UC-09)</text>
  <rect x="940" y="18" width="160" height="36" rx="8" fill="#4F46E5"/>
  <text x="1020" y="41" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">+ Tambah Kamar Baru</text>

  <!-- Main Content Area Desktop -->
  <!-- Stats Cards -->
  <g transform="translate(280, 95)">
    <!-- Stat 1 -->
    <rect width="200" height="85" rx="12" fill="#FFFFFF" filter="url(#shadowPC)"/>
    <text x="20" y="30" fill="#64748B" font-size="12" font-weight="600">Total Unit Kamar</text>
    <text x="20" y="62" fill="#0F172A" font-size="24" font-weight="800">8 Kamar</text>

    <!-- Stat 2 -->
    <rect x="220" width="200" height="85" rx="12" fill="#FFFFFF" filter="url(#shadowPC)"/>
    <text x="240" y="30" fill="#64748B" font-size="12" font-weight="600">Kamar Kosong (Siap Huni)</text>
    <text x="240" y="62" fill="#10B981" font-size="24" font-weight="800">3 Kamar</text>

    <!-- Stat 3 -->
    <rect x="440" width="200" height="85" rx="12" fill="#FFFFFF" filter="url(#shadowPC)"/>
    <text x="460" y="30" fill="#64748B" font-size="12" font-weight="600">Dipesan (Booking)</text>
    <text x="460" y="62" fill="#F59E0B" font-size="24" font-weight="800">1 Kamar</text>

    <!-- Stat 4 Legalitas -->
    <rect x="660" width="230" height="85" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="675" y="30" fill="#1E40AF" font-size="11" font-weight="700">Kepatuhan Permendag 19/2026</text>
    <text x="675" y="52" fill="#3B82F6" font-size="12" font-weight="600">NIB OSS Terdaftar</text>
    <text x="675" y="70" fill="#64748B" font-size="10">Layanan Jasa Dalam Negeri</text>
  </g>

  <!-- Data Table Card Desktop -->
  <g transform="translate(280, 205)" filter="url(#shadowPC)">
    <rect width="890" height="520" rx="14" fill="#FFFFFF"/>
    
    <!-- Table Header -->
    <text x="24" y="36" fill="#0F172A" font-size="15" font-weight="800">Daftar Kamar Kos Putri Anak Lanang</text>
    
    <!-- Table Head -->
    <rect x="24" y="54" width="842" height="38" rx="6" fill="#F1F5F9"/>
    <text x="40" y="78" fill="#475569" font-size="11" font-weight="700">FOTO</text>
    <text x="120" y="78" fill="#475569" font-size="11" font-weight="700">NO. KAMAR</text>
    <text x="240" y="78" fill="#475569" font-size="11" font-weight="700">TIPE &amp; UKURAN</text>
    <text x="380" y="78" fill="#475569" font-size="11" font-weight="700">HARGA SEWA / BLN</text>
    <text x="540" y="78" fill="#475569" font-size="11" font-weight="700">FASILITAS</text>
    <text x="700" y="78" fill="#475569" font-size="11" font-weight="700">STATUS</text>
    <text x="800" y="78" fill="#475569" font-size="11" font-weight="700">AKSI</text>

    <!-- Row 1: Kamar 01 -->
    <rect x="40" y="105" width="50" height="40" rx="6" fill="#4F46E5"/>
    <text x="65" y="130" fill="#FFFFFF" font-size="14" text-anchor="middle">🛏️</text>
    <text x="120" y="125" fill="#0F172A" font-size="13" font-weight="700">Kamar 01</text>
    <text x="120" y="140" fill="#64748B" font-size="10">ID: KMR-001</text>
    
    <rect x="240" y="112" width="76" height="22" rx="11" fill="#EEF2FF"/>
    <text x="278" y="127" fill="#4F46E5" font-size="10" font-weight="700" text-anchor="middle">Berperabot</text>
    <text x="240" y="145" fill="#64748B" font-size="10">Ukuran 3x4 m</text>

    <text x="380" y="128" fill="#10B981" font-size="13" font-weight="700">Rp 850.000</text>
    <text x="380" y="142" fill="#64748B" font-size="10">Bebas Ongkir</text>

    <text x="540" y="125" fill="#334155" font-size="11">AC, Kasur, KM Dalam</text>
    <text x="540" y="140" fill="#64748B" font-size="10">WiFi, Lemari Pakaian</text>

    <rect x="700" y="114" width="70" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="735" y="130" fill="#065F46" font-size="10" font-weight="700" text-anchor="middle">Kosong</text>

    <text x="800" y="130" fill="#4F46E5" font-size="12" font-weight="700">Ubah • Hapus</text>

    <line x1="24" y1="165" x2="866" y2="165" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Row 2: Kamar 02 -->
    <rect x="40" y="180" width="50" height="40" rx="6" fill="#0284C7"/>
    <text x="65" y="205" fill="#FFFFFF" font-size="14" text-anchor="middle">🚪</text>
    <text x="120" y="200" fill="#0F172A" font-size="13" font-weight="700">Kamar 02</text>
    <text x="120" y="215" fill="#64748B" font-size="10">ID: KMR-002</text>

    <rect x="240" y="187" width="76" height="22" rx="11" fill="#F1F5F9"/>
    <text x="278" y="202" fill="#64748B" font-size="10" font-weight="700" text-anchor="middle">Kosongan</text>
    <text x="240" y="220" fill="#64748B" font-size="10">Ukuran 3x3.5 m</text>

    <text x="380" y="203" fill="#10B981" font-size="13" font-weight="700">Rp 500.000</text>
    <text x="380" y="217" fill="#64748B" font-size="10">Bebas Ongkir</text>

    <text x="540" y="200" fill="#334155" font-size="11">KM Luar, Kipas Angin</text>
    <text x="540" y="215" fill="#64748B" font-size="10">WiFi, Parkir Motor</text>

    <rect x="700" y="189" width="70" height="24" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="735" y="205" fill="#92400E" font-size="10" font-weight="700" text-anchor="middle">Dipesan</text>

    <text x="800" y="205" fill="#4F46E5" font-size="12" font-weight="700">Ubah • Hapus</text>
  </g>
</svg>
